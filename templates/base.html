<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  全ページ共通の「枠」（テンプレート）。
  {{…}} の部分に build.py が各ページの中身を差し込んで docs/ に書き出します。
  ここを1か所直せば、全ページのヘッダー・フッターが一度に変わります。
-->
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="音感トレーニング">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="{{site_url}}{{path}}">
<meta property="og:image" content="{{site_url}}images/ogp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{site_url}}{{path}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 共通ヘッダー（サイト名＋ページ一覧） ============ -->
<nav class="sitenav" aria-label="サイト内メニュー">
  <div class="wrap">
    <a class="brand" href="index.html">音感トレーニング</a>
    <ul>
{{nav}}
    </ul>
  </div>
</nav>

{{content}}

<!-- ============ 共通フッター ============ -->
<footer>
  <div class="wrap">
    <p>© 2026 音感トレーニング — アドリブへの耳をつくる</p>
    <p>このサイトは、自作アプリの紹介と「Webページを作って公開する」練習を兼ねて制作しました。<a href="about.html#making">作り方はこちら</a>。</p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
